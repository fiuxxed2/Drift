name: Drift
options:
  bundleIdPrefix: com.drift
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  Drift:
    type: application
    platform: iOS
    sources:
      - path: Drift
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: Drift
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.drift.focustimer
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
